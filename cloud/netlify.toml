[build]
  publish = "."
  command = ""

[[redirects]]
  from = "/"
  to = "/billotech/pro/"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/billotech/cloud/*.js"
  [headers.values]
    Cache-Control = "public, max-age=300"
