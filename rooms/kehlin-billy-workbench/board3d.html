 document.getElementById('list').innerHTML=shots.map((s,i)=>`<div class="shot" data-i="${i}"><h4>${s.n} <small>· ${s.d}s</small></h4><p><b>${s.loc}</b><br>${s.vo}</p><small>LENS ${s.lens}<br>SOUND ${s.sfx}<br>MAKE ${s.gen}</small></div>`).join('');
 document.querySelectorAll('.shot').forEach(el=>el.onclick=()=>{SEL=+el.dataset.i;T=startOf(SEL)+0.01;render();editor()});editor();
 let x=0;document.getElementById('tl').innerHTML=shots.map(s=>{const w=s.d/total*100,h=`<div class="seg" style="left:${x}%;width:${w}%">${s.n}</div><div class="sfx" style="left:${x}%">${s.sfx}</div>`;x+=w;return h}).join('')+'<div class="ph" id="ph"></div>';
 document.getElementById('legend').innerHTML=Object.values(proj.cast).map(([n,c])=>`<span><i style="background:#${c.toString(16).padStart(6,'0')}"></i>${n}</span>`).join('');render()}
function startOf(i){return shots.slice(0,i).reduce((s,x)=>s+x.d,0)}
const lerp=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function render(){if(!shots.length){document.getElementById('sub').textContent='No shots yet';R.render(S,C);return}let i=0,acc=0;while(i<shots.length-1&&T>=acc+shots[i].d){acc+=shots[i].d;i++}const s=shots[i],t=Math.min(1,(T-acc)/s.d),e=ease(t);
 C.position.set(...lerp(s.cam[0],s.cam[1],e));C.lookAt(...s.look);
 for(const [k,a] of Object.entries(actors)){const p=s.act[k];a.visible=!!p&&!s.card;if(p){a.position.set(...lerp(p[0],p[1],e));a.lookAt(C.position.x,0,C.position.z);
   const run=(p[0][2]!==p[1][2]||p[0][0]!==p[1][0]);a.position.y=run?Math.abs(Math.sin(T*9))*0.12:0;
   const hd=a.getObjectByName('head');if(s.pop===k&&t>.55){hd.position.y=hd.userData.y+(t-.55)*5;hd.rotation.x=(t-.55)*12}else{hd.position.y=hd.userData.y;hd.rotation.x=0}}}
 document.getElementById('sub').textContent=s.card?'CREME GAWDS · BLACK FRIDAY 11.27':s.vo;
 document.getElementById('slate').textContent=`SHOT ${s.n} · ${s.lens}`;
 document.querySelectorAll('.shot').forEach((el,j)=>el.classList.toggle('on',j===i));
 document.getElementById('clock').textContent=T.toFixed(1)+'s / '+total+'s';const ph=document.getElementById('ph');if(ph)ph.style.left=(T/total*100)+'%';
 R.render(S,C)}
function size(){const w=stage.clientWidth,h=stage.clientHeight;R.setSize(w,h);C.aspect=w/h;C.updateProjectionMatrix();render()}
function tick(now){if(!playing)return;const dt=(now-last)/1000;last=now;T+=dt;if(T>=total){T=total-0.01;playing=false;document.getElementById('play').textContent='▶ Play animatic'}render();requestAnimationFrame(tick)}
document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'❚❚ Pause':'▶ Play animatic';if(playing){if(T>=total-0.02)T=0;last=performance.now();requestAnimationFrame(tick)}};
document.getElementById('stop').onclick=()=>{playing=false;T=0;document.getElementById('play').textContent='▶ Play animatic';render()};
document.getElementById('tl').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();T=(e.clientX-r.left)/r.width*total;render()};
let SEL=0,W=null,CUR=null;
const RP={whip:['kfx-whip-101','Whip · Ep 101 "First Date"'],bf:['kfx-bf-armageddon','Creme Gawds · Black Friday'],armageddon:['kfx-armageddon','Armageddon'],onenight:['kfx-onenight','One Night At…']};
const $=id=>document.getElementById(id);const clone=o=>JSON.parse(JSON.stringify(o));
async function starter(id){ // no 3D pass yet: block one shot per beat from the script room
 let beats=[];try{const sb=window.supabase&&window.supabase.createClient('https://hnzekejoaamsnmtqtwie.supabase.co','sb_publishable_51ybFNizblfWMqL_qdekcg_kZT7nXHy',{auth:{persistSession:true}});
  const {data}=await sb.from('room_projects').select('beats,outline').eq('id',RP[id][0]).maybeSingle();beats=(data&&((data.beats&&data.beats.length?data.beats:data.outline)||[]))||[]}catch(e){}
 if(!beats.length)beats=[{title:'Opening',text:'Add the first beat'}];
 return {set:'street',cast:{A:['Lead',0xE8B54A],B:['Second lead',0x22D3EE]},shots:beats.map((b,i)=>({n:`${i+1} · ${b.title||b.heading||'Beat '+(i+1)}`,d:5,loc:'TBD',lens:'35mm',cam:[[0,1.5,6],[0,1.5,4.5]],look:[0,1.2,0],act:{A:[[-0.8,0,0],[-0.8,0,0]],B:[[0.8,0,0],[0.8,0,0]]},vo:(b.text||'').slice(0,220),sfx:'—',gen:'blocking only'}))}}
function chips(){ $('pchips').innerHTML=Object.entries(RP).map(([k,[,t]])=>`<button data-p="${k}" class="${k===CUR?'on':''}">${t}</button>`).join('');
 $('pchips').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>open(b.dataset.p))}
function status(st){$('save').textContent={saved:`saved to binder · step ${W?W.head:0}`,saving:'saving…',device:`saved on this device · step ${W?W.head:0}`}[st]||st;$('save').className=st}
function tools(){$('undo').disabled=!W.canUndo();$('redo').disabled=!W.canRedo();
 $('hist').innerHTML=W.history.slice().reverse().map(e=>`<option value="${e.seq}" ${e.seq===W.head?'selected':''}>${e.seq===W.head?'● ':''}${e.seq} · ${e.label}</option>`).join('')}
async function open(id){CUR=id;chips();T=0;SEL=0;history.replaceState(null,'','?p='+id);
 const seed=P[id]?clone(P[id]):await starter(id);
 W=RoomWork({project:RP[id][0],kind:'board3d',title:RP[id][1],seed,onstatus:status,onchange:st=>{proj=clone(st);build();tools()}});
 window.__rwActive=W;await W.open()}
function commit(label){W.commit(label,proj)}
const F=[['n','Shot'],['d','Seconds'],['loc','Location'],['lens','Lens / move'],['vo','Dialogue'],['sfx','Sound'],['gen','Make']];
function editor(){let ed=$('ed');if(!ed){ed=document.createElement('div');ed.id='ed';$('list').prepend(ed)}
 const sh=shots[SEL];if(!sh){ed.innerHTML='<div class="empty">No shots. <button id="addfirst">+ Add a shot</button></div>';const a=$('addfirst');if(a)a.onclick=()=>{proj.shots.push({n:'1 · New shot',d:5,loc:'',lens:'35mm',cam:[[0,1.5,6],[0,1.5,4.5]],look:[0,1.2,0],act:{},vo:'',sfx:'',gen:''});commit('Add shot')};return}
 ed.innerHTML=`<div style="font-size:.7rem;letter-spacing:.12em;color:#22D3EE">EDIT · SHOT ${SEL+1} OF ${shots.length}</div>`+F.map(([k,l])=>`<label>${l}</label>${k==='vo'?`<textarea data-f="${k}"></textarea>`:`<input data-f="${k}" ${k==='d'?'type="number" min="1" max="30" step="0.5"':''}>`}`).join('')+
  `<div class="row"><button data-a="up">↑</button><button data-a="down">↓</button><button data-a="dup">⧉ Duplicate</button><button data-a="add">+ After</button><button data-a="del">✕ Delete</button></div>`;
 ed.querySelectorAll('[data-f]').forEach(el=>{const k=el.dataset.f;el.value=sh[k]??'';el.onchange=()=>{sh[k]=k==='d'?Math.max(1,+el.value||1):el.value;commit(`Shot ${SEL+1} · ${k==='d'?'length '+sh.d+'s':F.find(f=>f[0]===k)[1].toLowerCase()}`)}});
 ed.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a,L=proj.shots;
  if(a==='up'&&SEL>0){[L[SEL-1],L[SEL]]=[L[SEL],L[SEL-1]];SEL--;commit(`Move shot up`)}
  else if(a==='down'&&SEL<L.length-1){[L[SEL+1],L[SEL]]=[L[SEL],L[SEL+1]];SEL++;commit(`Move shot down`)}
  else if(a==='dup'){L.splice(SEL+1,0,clone(L[SEL]));SEL++;commit(`Duplicate shot ${SEL}`)}
  else if(a==='add'){const n=clone(L[SEL]);n.n=`${SEL+2} · New shot`;n.vo='';n.sfx='';L.splice(SEL+1,0,n);SEL++;commit('Add shot')}
  else if(a==='del'){if(!confirmDel())return;L.splice(SEL,1);SEL=Math.max(0,SEL-1);commit('Delete shot')}})}
function confirmDel(){return true} /* deletes are undoable, so no blocking dialog */
$('undo').onclick=()=>W.undo();$('redo').onclick=()=>W.redo();$('hist').onchange=e=>W.jump(+e.target.value);
const q=new URLSearchParams(location.search).get('p');
addEventListener('resize',size);open(RP[q]?q:'whip').then(size);
</script></body></html>
